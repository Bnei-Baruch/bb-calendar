name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy to VM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /root/luz

          # Configure git
          git config --global --add safe.directory /root/luz
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Preserve runtime files that are tracked in git but mutated live on prod
          # (Telegram bot session, cached posts) — a hard reset would otherwise revert them.
          cp -f telegram-session.txt /tmp/telegram-session.txt.bak 2>/dev/null || true
          cp -f data/posts.json /tmp/posts.json.bak 2>/dev/null || true

          # Fetch latest from remote using HTTPS with token
          git fetch https://${{ env.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref_name }}

          # Reset to exact remote version of current branch (discards local changes)
          git reset --hard FETCH_HEAD

          # Clean untracked files, but never touch data/ or backups/
          # (Telegram media cache, DB backups — not recoverable from git)
          git clean -fd -e data -e backups

          # Restore the preserved runtime files
          cp -f /tmp/telegram-session.txt.bak telegram-session.txt 2>/dev/null || true
          cp -f /tmp/posts.json.bak data/posts.json 2>/dev/null || true

          # Install deps and build frontend
          npm install
          npm run build

          # Restart both PM2 processes
          pm2 restart bb-calendar-api bb-calendar-web

          # Show status
          pm2 list
